<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Brand mark -->
  <g transform="translate(80,120)">
    <rect x="0" y="0" width="360" height="360" rx="28" fill="#0ea5a9" />
    <text x="30" y="210" font-family="Inter, Arial, sans-serif" font-size="96" fill="#072b2b" font-weight="700">F</text>
  </g>

  <!-- Tagline -->
  <g transform="translate(480,170)" fill="#E6EEF2" font-family="Inter, Arial, sans-serif">
    <text x="0" y="0" font-size="48" font-weight="700">FormHook</text>
    <text x="0" y="64" font-size="20">Collect, route &amp; manage form submissions in minutes.</text>
    <text x="0" y="100" font-size="18" fill="#A7B8BB">Integrations: Slack • Webhooks • Google Sheets • Email</text>

    <!-- small UI mock -->
    <rect x="0" y="140" width="520" height="220" rx="14" fill="#07131a" opacity="0.18" filter="url(#f1)" />
    <g transform="translate(16,156)">
      <rect x="0" y="0" width="360" height="36" rx="6" fill="#06b6d4" />
      <rect x="0" y="56" width="260" height="28" rx="6" fill="#0ea5a9" opacity="0.9" />
      <rect x="0" y="100" width="180" height="28" rx="6" fill="#10b981" opacity="0.85" />
    </g>
  </g>

  <!-- subtle accent -->
  <circle cx="1060" cy="120" r="80" fill="#0ea5a9" opacity="0.06" />
</svg>
