<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormHook Avatar Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto space-y-8">
        <h1 class="text-3xl font-bold text-gray-900">FormHook Avatar & Dashboard Test</h1>
        
        <!-- Welcome Block Test -->
        <div class="w-full bg-white shadow-xl rounded-2xl p-8 flex flex-col md:flex-row items-center justify-between border border-gray-200 relative overflow-hidden">
            <!-- FormHook blue accent border -->
            <div class="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-blue-600 to-blue-400"></div>
            
            <div class="flex items-center gap-6 z-10">
                <div class="h-16 w-16 rounded-full bg-gradient-to-r from-blue-600 to-blue-400 flex items-center justify-center shadow-lg">
                    <span class="text-2xl font-bold text-white">F</span>
                </div>
                <div>
                    <h1 class="text-2xl md:text-3xl font-bold text-gray-900 mb-2">
                        Welcome back, User!
                    </h1>
                    <div class="flex flex-col sm:flex-row gap-2 sm:gap-6">
                        <span class="text-gray-600 font-medium flex items-center gap-1">
                            <span class="text-blue-600 font-bold">15</span> 
                            submissions this week
                        </span>
                    </div>
                </div>
            </div>
            <div class="flex gap-3 mt-6 md:mt-0 z-10">
                <button class="flex gap-2 bg-blue-600 hover:bg-blue-700 text-white shadow-lg px-4 py-2 rounded">
                    Manage Forms
                </button>
            </div>
        </div>

        <!-- Account Page Avatar Test -->
        <div class="bg-white p-6 rounded-xl shadow">
            <h2 class="text-xl font-bold mb-4">Account Page Avatar</h2>
            <div class="flex items-center gap-4">
                <div class="w-20 h-20 rounded-full bg-gradient-to-r from-blue-600 to-blue-400 flex items-center justify-center text-white text-2xl font-bold">
                    F
                </div>
                <div>
                    <p class="text-gray-600">Profile Picture</p>
                    <p class="text-sm text-gray-500">FormHook Theme</p>
                </div>
            </div>
        </div>

        <!-- Color Comparison -->
        <div class="bg-white p-6 rounded-xl shadow">
            <h2 class="text-xl font-bold mb-4">Color Theme Comparison</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <h3 class="font-medium mb-2">Old (Purple/Indigo)</h3>
                    <div class="h-16 w-16 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 flex items-center justify-center shadow-lg">
                        <span class="text-2xl font-bold text-white">F</span>
                    </div>
                </div>
                <div>
                    <h3 class="font-medium mb-2">New (FormHook Blue)</h3>
                    <div class="h-16 w-16 rounded-full bg-gradient-to-r from-blue-600 to-blue-400 flex items-center justify-center shadow-lg">
                        <span class="text-2xl font-bold text-white">F</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
